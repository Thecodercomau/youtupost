<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="default" data-density="comfortable">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08090D">
  <meta name="description" content="Youtupost — Share what happens next. A futuristic social media platform.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Youtupost — Share what happens next</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%236C5CE7' rx='20'/><polygon points='35,20 80,50 35,80' fill='white'/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%236C5CE7' rx='20'/><polygon points='35,20 80,50 35,80' fill='white'/></svg>">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="app">
    <!-- App Layout -->
    <div id="app-inner" style="display:flex;min-height:100vh;min-height:100dvh;">

      <!-- Desktop Sidebar -->
      <aside id="sidebar" class="sidebar" role="navigation" aria-label="Main navigation"></aside>

      <!-- Main Content -->
      <main class="main-content" id="main-content">
        <!-- Desktop Topbar -->
        <header id="topbar" class="topbar" role="banner"></header>

        <!-- Mobile Topbar -->
        <header class="mobile-topbar" id="mobile-topbar">
          <div style="display:flex;align-items:center;gap:var(--space-3);">
            <div style="width:32px;height:32px;background:var(--gradient-accent);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;">
              <svg viewBox="0 0 24 24" fill="white" width="18" height="18"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            </div>
            <span style="font-size:var(--text-lg);font-weight:700;background:var(--gradient-accent);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Youtupost</span>
          </div>
          <div style="display:flex;align-items:center;gap:var(--space-2);">
            <button class="topbar-btn" onclick="location.hash='#/search'" aria-label="Search">
              <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" fill="none" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
            <button class="topbar-btn" onclick="location.hash='#/notifications'" aria-label="Notifications">
              <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" fill="none" stroke-width="1.8"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </button>
            <button class="topbar-btn" onclick="location.hash='#/messages'" aria-label="Messages">
              <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" fill="none" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            </button>
          </div>
        </header>

        <!-- Pages -->
        <div id="page-login" class="page"></div>
        <div id="page-register" class="page"></div>
        <div id="page-home" class="page"></div>
        <div id="page-explore" class="page"></div>
        <div id="page-shorts" class="page"></div>
        <div id="page-messages" class="page"></div>
        <div id="page-notifications" class="page"></div>
        <div id="page-create" class="page"></div>
        <div id="page-profile" class="page"></div>
        <div id="page-settings" class="page"></div>
        <div id="page-communities" class="page"></div>
        <div id="page-saved" class="page"></div>
        <div id="page-ai" class="page"></div>
        <div id="page-search-page" class="page"></div>
      </main>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav id="mobile-bottom-nav" class="mobile-bottom-nav" aria-label="Mobile navigation"></nav>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" style="position:fixed;top:var(--topbar-height);right:var(--space-4);z-index:500;display:flex;flex-direction:column;gap:var(--space-2);pointer-events:none;"></div>

  <!-- Application Script -->
  <script type="module" src="js/app.js"></script>

  <!-- Service Worker: force-clear old caches and register fresh -->
  <script>
    if ('serviceWorker' in navigator) {
      // Immediately unregister ALL old service workers and clear caches
      navigator.serviceWorker.getRegistrations().then(regs => {
        Promise.all(regs.map(r => r.unregister()));
      });
      caches.keys().then(keys => {
        Promise.all(keys.map(k => caches.delete(k)));
      });
      // Register fresh SW
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=3').catch(() => {});
      });
    }
  </script>

  <!-- Error fallback: show something if JS fails -->
  <script>
    window.addEventListener('error', function(e) {
      console.error('Global error:', e.message, e.filename, e.lineno);
    });
    window.addEventListener('unhandledrejection', function(e) {
      console.error('Unhandled rejection:', e.reason);
    });
  </script>
</body>
</html>
